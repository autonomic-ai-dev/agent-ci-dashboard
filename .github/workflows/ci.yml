name: CI

# Path-filter pattern aligned with agent-brain: skip full jobs when only
# non-runtime paths change on PRs. Manual/workflow_call always runs.
on:
  pull_request:
    branches: [master]
    paths-ignore:
      - "**.md"
      - "docs/**"
  push:
    branches: [master]
    paths:
      - "src/**"
      - "crates/**"
      - "proto/**"
      - "migrations/**"
      - "package.json"
      - "bun.lock"
      - "vite.config.ts"
      - "Cargo.toml"
      - "Cargo.lock"
      - "Makefile"
      - "scripts/**"
      - ".github/workflows/**"
      - ".github/pipelines/**"
      - "!**.md"
      - "!docs/**"
  workflow_dispatch:
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  filter:
    name: Check runtime change paths
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.filter.outputs.skip_pipeline }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Check runtime change paths
        id: filter
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE_REF="${{ github.base_ref }}"
            git fetch origin "$BASE_REF" --depth=1 >/dev/null 2>&1 || true
            CHANGED=$(git diff --name-only "origin/$BASE_REF...HEAD" 2>/dev/null || git diff --name-only HEAD~1 2>/dev/null || true)
            NON_DOCS=$(echo "$CHANGED" | grep -v -E '\.md$' | grep -v -E '^docs/' | grep -v -E '^\.cursor/' | sed '/^[[:space:]]*$/d' || true)
            if [ -z "$NON_DOCS" ]; then
              echo "skip_pipeline=true" >> "$GITHUB_OUTPUT"
              echo "Only non-runtime paths modified; skipping CI jobs."
              exit 0
            fi
          fi
          echo "skip_pipeline=false" >> "$GITHUB_OUTPUT"

  frontend:
    name: Frontend (SvelteKit)
    needs: [filter]
    if: needs.filter.outputs.skip != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Cache bun deps
        uses: actions/cache@v5
        with:
          path: ~/.bun/install/cache
          key: bun-${{ hashFiles('bun.lock') }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type check
        run: bun run check

      - name: Build
        run: bun run build
